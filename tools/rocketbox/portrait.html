<!doctype html><meta charset="utf-8"><title>Portrait bake</title>
<!-- v11.1: bakes dialogue portraits of the realistic cast. Driven by tools/e2e/portraits.mjs; not part of the game. -->
<body style="margin:0;background:transparent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
const W = 400, H = 500;
const r = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.85;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(22, W / H, 0.1, 20);
scene.add(new THREE.HemisphereLight('#f2f6ff', '#5a5048', 0.55));
const key = new THREE.DirectionalLight('#fff3e2', 1.2); key.position.set(1.2, 2.2, 2.4); scene.add(key);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.45); fill.position.set(-2, 1.2, 1.5); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffffff', 0.7); rim.position.set(-1.5, 2, -2.5); scene.add(rim);
new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('../../assets/textures/blender_institute_1k.hdr', (t) => { const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromEquirectangular(t).texture; });
const L = new THREE.GLTFLoader(), load = (u) => new Promise((ok, bad) => L.load(u, ok, undefined, bad));
// bake(url, anims, clip) → PNG data URL of a head-and-shoulders bust, three-quarter view
window.bake = async (url, anims, clip = 'idle', t = 0.6) => {
  const [g, a] = await Promise.all([load(url), load(anims)]);
  const m = THREE.SkeletonUtils.clone(g.scene); scene.add(m);
  m.traverse(n => { if (n.isMesh) { n.frustumCulled = false; if (n.material) n.material.envMapIntensity = 0.6; } });
  const have = new Set(); m.traverse(n => have.add(n.name));
  const an = a.animations.find(x => x.name === clip); const mixer = new THREE.AnimationMixer(m);
  if (an) { mixer.clipAction(new THREE.AnimationClip(an.name, an.duration, an.tracks.filter(tr => have.has(tr.name.split('.')[0])))).play(); mixer.update(t); }
  m.rotation.y = -0.32; m.updateMatrixWorld(true);
  let head = m.getObjectByName('Bip01_Head'); if (!head) m.traverse(n => { if (!head && /Head$/.test(n.name)) head = n; }); const hp = head.getWorldPosition(new THREE.Vector3());
  cam.position.set(hp.x + 0.05, hp.y + 0.02, hp.z + 2.5); cam.lookAt(hp.x, hp.y - 0.2, hp.z);
  r.render(scene, cam); const url2 = r.domElement.toDataURL('image/png'); scene.remove(m); return url2;
};
window.ready = true;
</script>
